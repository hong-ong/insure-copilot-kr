[project]
name = "insure-copilot-kr"
version = "0.1.0"
description = "보험 약관·규정 AI 어시스턴트 — AI 기획자 8주 포트폴리오 프로젝트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 1주차: LLM 호출과 토큰·비용 측정
    "litellm>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insure_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
